<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Movie Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Movie Library</h1>

    <!-- Search -->
    <div id="search-section">
        <input type="text" id="searchInput" placeholder="Search for a movie...">
        <button id="searchBtn">Search</button>
    </div>

    <!-- Error Message -->
    <p id="errorMsg"></p>

    <!-- Results -->
    <div id="results"></div>

    <!-- Movie Details -->
    <div id="movieDetails"></div>

    <!-- Favorites -->
    <h2> Favorites</h2>
    <div id="favorites"></div>

    <script src="app.js"></script>
</body>
</html>
